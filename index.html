<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/intelliheal-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="IntelliHeal — Premium AI-powered addiction recovery and mental health platform with real-time risk detection, personalized wellness plans, and multimodal health monitoring." />
  <meta name="theme-color" content="#080612" />
  <title>IntelliHeal — AI Health Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #080612;
      color: #f0f4f8;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* App loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #080612;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7C3AED;
      border-right-color: #06B6D4;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo-ring"></div>
    <p style="color: rgba(148,163,184,0.6); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">
      IntelliHeal
    </p>
  </div>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Remove loading screen after app renders
    window.addEventListener('load', () => {
      setTimeout(() => {
        const el = document.getElementById('loading-screen');
        if (el) el.classList.add('hidden');
      }, 800);
    });
  </script>
</body>

</html>
